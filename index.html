<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Pixel Gridiron</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Gridiron">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div id="gameWrap" hidden>
    <div id="stage">
      <canvas id="cv" width="320" height="180"></canvas>
      <div id="joy" hidden><div id="knob"></div></div>
      <button id="actBtn" hidden>ACT</button>
      <button id="pauseBtn">II</button>
      <div id="callUI"></div>
    </div>
  </div>
  <div id="modal" hidden></div>
</div>
<script src="js/data.js"></script>
<script src="js/league.js"></script>
<script src="js/sprites.js"></script>
<script src="js/match.js"></script>
<script src="js/ui.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
